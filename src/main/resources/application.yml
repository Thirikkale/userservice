server:
  address: 0.0.0.0
  port: 8081
  servlet:
    context-path: /user-service
  error:
    include-message: always
    include-binding-errors: always

cors:
    allowed-origins: "*"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/thirikkale_user_db
    username: postgres
    password: 1111
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000         # Reduced to 5 seconds
      maximum-pool-size: 10            # Reduced pool size
      minimum-idle: 3
      idle-timeout: 300000             # 5 minutes
      max-lifetime: 1800000            # 30 minutes
      leak-detection-threshold: 10000   # Reduced to 10 seconds
      validation-timeout: 2000         # Reduced to 2 seconds

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false  # Disable SQL logging in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false  # Very important - prevents connection leaks

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  cache:
    type: redis
    redis:
      time-to-live: 600000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    require-ssl: false

jwt:
  secret: 75533e39c1be679894fc643f6419eef8ce5a90c2042ab40e5504821271567472
  expiration: 3600000
  refresh-expiration: 604800000

firebase:
  project-id: thirikkale-app
  config:
    path: firebase-service-account.json

file:
  upload:
    dir: uploads/
    max-size: 10485760 # 10MB

otp:
  expiration-minutes: 5
  max-attempts: 3

# Python Integration Configuration - REDUCED TIMEOUTS
python:
  interpreter: python
  scripts:
    path: d:/Backend/userservice/python_scripts
  fastapi:
    url: http://127.0.0.1:8001
    timeout: 200  # Reduced to 30 seconds
  memory:
    limit: 1GB
  timeout:
    seconds: 200  # Reduced to 30 seconds

# Logging Configuration - REDUCED verbosity
logging:
  level:
    com.thirikkale: INFO  # Changed from DEBUG
    org.springframework.security: WARN  # Changed from DEBUG
    org.springframework.web.cors: WARN
    org.springframework.security.web.access: WARN
    org.hibernate.SQL: WARN  # Changed from DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.cache: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/user-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

